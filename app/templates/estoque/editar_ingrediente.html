{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Editar Ingrediente</h2>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            Salvar Alterações
        </button>

        <a href="{% url 'listar_ingredientes' %}" class="btn btn-secondary">
            Cancelar
        </a>
    </form>
</div>
{% endblock %}
