
{% extends 'base.html' %}

{% block title %}Confirmar Pedido - Pizzaria{% endblock %}

{% block content %}

<div class="container mt-4">
    <h1 class="mb-4">Confirmar Pedido</h1>

    <div class="card shadow-sm">
        <div class="card-body">

            <form method="POST">
                {% csrf_token %}

                {{ form.as_p }}

                <div class="mt-4">
                    <button type="submit" class="btn btn-success">
                        Confirmar pedido
                    </button>

                    <a href="{% url 'visualizar_carrinho' %}"
                       class="btn btn-secondary">
                        Voltar ao carrinho
                    </a>
                </div>
            </form>

        </div>
    </div>
</div>

{% endblock %}
