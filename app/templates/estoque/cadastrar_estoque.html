{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">

    <h2>Cadastrar Estoque</h2>

    <div class="card shadow-sm mt-3">
        <div class="card-body">

            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}

                <button type="submit" class="btn btn-primary">
                    Cadastrar
                </button>

                <a href="{% url 'listar_estoque' %}" class="btn btn-secondary">
                    Voltar
                </a>
            </form>

        </div>
    </div>

</div>
{% endblock %}
