
{% extends 'base.html' %}

{% block title %}Editar Estoque{% endblock %}

{% block content %}
<div class="container mt-4">

    <div class="card shadow-sm">
        <div class="card-body">

            <h2>Editar Estoque</h2>

            <p>
                Ingrediente: <strong>{{ estoque.ingrediente.nome }}</strong>
            </p>

            <form method="POST">
                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="btn btn-primary">
                    Salvar Alterações
                </button>

                <a href="{% url 'listar_estoque' %}" class="btn btn-secondary">
                    Cancelar
                </a>
            </form>

        </div>
    </div>

</div>
{% endblock %}
