{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">

    <h2>Editar Produto: {{ produto.nome }}</h2>

    <div class="card shadow-sm">
        <div class="card-body">

            <form method="POST">
                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="btn btn-success">
                    Salvar alterações
                </button>

                <a href="{% url 'listar_produtos' %}"
                   class="btn btn-secondary">
                    Cancelar
                </a>
            </form>

        </div>
    </div>

</div>
{% endblock %}
